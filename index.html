<script>
// 1. 소리 파일 객체 생성 (오디오 파일 경로를 깃허브와 맞추세요)
const sounds = {
  deong: new Audio('deong.mp3'),
  gung: new Audio('gung.mp3'),
  chae: new Audio('chae.mp3'),
  gideok: new Audio('gideok.mp3'),
  roll: new Audio('roll.mp3')
};

// 2. 판정 시 소리 재생 로직을 hit() 함수 안에 넣습니다
function hit(type) {
  let targetNote = null;
  const availableNotes = document.querySelectorAll(".jnote");
  for (let i = 0; i < availableNotes.length; i++) {
    if (availableNotes[i].dataset.hit === "false") {
      targetNote = availableNotes[i];
      break;
    }
  }
  if (!targetNote) return;

  const x = parseInt(targetNote.style.left);
  const targetX = 260; 
  const diff = Math.abs(x - targetX);

  if (diff < 95) {
    let nType = targetNote.dataset.type;
    let isHitMatch = false;

    // 맞는 노트 타입에 따라 소리 재생
    if (nType === type || (nType === "gideok" && type === "chae") || (nType === "roll-master" && type === "roll")) {
      isHitMatch = true;
      // 🎶 여기서 소리를 재생합니다!
      if (sounds[nType]) {
          sounds[nType].currentTime = 0;
          sounds[nType].play().catch(e => console.log("자동재생 대기"));
      } else if (nType === "gideok" && sounds.gideok) {
          sounds.gideok.currentTime = 0;
          sounds.gideok.play();
      }
    }

    if (isHitMatch) {
      targetNote.dataset.hit = "true"; 
      targetNote.remove();
      combo++;
      // ... 이후 점수/콤보 로직 동일
    }
  }
}
</script>
